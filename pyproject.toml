[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spaarma"
version = "0.1.0"
description = "Masked reconstruction and multi-positive attention for multi-slice spatial transcriptomics integration"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "anndata>=0.9",
  "numpy>=1.23",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "torch>=2.0",
  "torch-geometric>=2.3"
]

[project.optional-dependencies]
test = ["pytest>=7"]
tutorial = [
  "scanpy>=1.9",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "jupyterlab>=4",
  "scikit-misc>=0.2",
  "louvain>=0.8",
  "leidenalg>=0.10",
  "igraph>=0.10"
]
mclust = ["rpy2>=3.5"]

[tool.setuptools.packages.find]
include = ["spaarma*"]
