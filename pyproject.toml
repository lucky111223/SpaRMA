[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spaarma"
version = "0.1.0"
description = "Masked reconstruction and multi-positive attention for multi-slice spatial transcriptomics integration"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "anndata>=0.9",
  "numpy>=1.23",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "torch>=2.0",
  "torch-geometric>=2.3"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["spaarma*"]
